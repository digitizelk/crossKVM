[workspace]
resolver = "2"
members = [
    "crates/kvm-core",
    "crates/kvm-platform",
    "crates/kvm-net",
    "crates/kvm-clipboard",
    "crates/kvm-daemon",
]

[workspace.dependencies]
kvm-core = { path = "crates/kvm-core" }
kvm-platform = { path = "crates/kvm-platform" }
kvm-net = { path = "crates/kvm-net" }
kvm-clipboard = { path = "crates/kvm-clipboard" }

tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
bytes = "1.6"
clap = { version = "4.5", features = ["derive"] }
